<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマブラSP キャラビンゴ</title>
  <style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#1b1b2f,#162447,#1f4068);
  color:white;

  height:100vh;
  overflow:hidden;

  display:flex;
  justify-content:center;
}

#container{
  width:min(95vw,900px);
  height:100vh;

  display:flex;
  flex-direction:column;

  padding:8px;
  box-sizing:border-box;
}

h1{
  margin:10px 0;
  font-size:clamp(20px,4vw,32px);
}

#controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:10px;
}

select,button{
  font-size:clamp(12px,2vw,16px);
  padding:6px 12px;
  border-radius:8px;
  border:none;
}

button{
  background:#ffcc00;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ffd84d;
}

details{
  margin:10px auto;
  background:rgba(255,255,255,0.1);
  border-radius:8px;
  padding:8px;
}

summary{
  cursor:pointer;
  font-weight:bold;
  font-size:16px;
}

#dlc-area{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:6px 10px;
}

#dlc-area{
  margin-top:6px;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:4px 8px;

  font-size:12px;
}

.bingo-grid{
  flex:1;

  display:grid;

  gap:4px;

  width:100%;
  height:100%;

  max-width:90vmin;
  max-height:90vmin;

  margin:auto;
}

.bingo-cell{
  background:white;
  color:black;
  border-radius:6px;
  border:1px solid #aaa;
  font-weight:bold;
  font-size:clamp(10px,1.8vw,18px);
  aspect-ratio:1/1;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:4px;
  cursor:pointer;
  user-select:none;
  transition:0.15s;
}

.bingo-cell:hover{
  transform:scale(1.05);
}

.bingo-cell.marked{
  background:#4caf50;
  color:white;
}

.free{
  background:#ffcc00;
}

.bingo-cell.highlight{
  border:3px solid red;
  animation:blink 1s infinite;
}

.bingo-cell.highlight.marked{
  background:#4caf50 !important;
  animation:none;
  border:2px solid green;
}

@keyframes blink{
  0%{background:#fff;}
  50%{background:#ffd0d0;}
  100%{background:#fff;}
}

h1{
  margin:4px 0;
  font-size:clamp(18px,3vw,28px);
}

  </style>
</head>
<body>

<div id="container">

<h1>スマブラSP ビンゴ</h1>

<div id="controls">

サイズ
<select id="size">
<option value="3">3×3</option>
<option value="5" selected>5×5</option>
<option value="7">7×7</option>
</select>

<button id="generate-btn">ビンゴ生成</button>
<button id="random-cell-btn">ランダム1マス</button>

</div>

<details>
<summary>DLCキャラ所持設定</summary>
<div id="dlc-area"></div>
</details>

<div id="bingo-card" class="bingo-grid"></div>

</div>

  <script src="characters.js"></script>
  <script src="script.js"></script>
</body>
</html>
