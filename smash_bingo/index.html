<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマブラSP キャラビンゴ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2vh 2vw;
      margin: 0;
      box-sizing: border-box;
    }

    h1 {
      font-size: clamp(16px, 5vw, 28px);
      margin-bottom: 1em;
    }

    select, button {
      font-size: clamp(12px, 3vw, 18px);
      padding: 0.4em 0.8em;
      margin: 0.5em;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .bingo-grid {
      display: grid;
      gap: 0.5vw;
      margin: 1em auto;
      justify-content: center;
      max-width: 90vmin;
      max-height: 90vmin;
    }

    .bingo-cell {
      background-color: #fff;
      border: 1px solid #ccc;
      font-weight: bold;
      font-size: clamp(10px, 2vw, 18px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border-radius: 4px;
      user-select: none;
      padding: 0.5em;
    }

    .bingo-cell.marked {
      background-color: #90ee90;
    }

    .free {
      background-color: #ffeb3b;
    }

  .bingo-cell.highlight.marked{
    background-color:#90ee90 !important;
    animation:none;
    border:2px solid green;
  }

    @keyframes blink{
      0%{background:#fff;}
      50%{background:#ffd0d0;}
      100%{background:#fff;}
    }

    .bingo-cell.highlight{
      border:3px solid red;
      animation:blink 1s infinite;
    }

  @keyframes blink{
    0%{background:#fff;}
    50%{background:#ffd0d0;}
    100%{background:#fff;}
  }

  #dlc-area{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-top:10px;
  }

  #dlc-section{
    margin-bottom:15px;
  }

  #dlc-section summary{
    cursor:pointer;
    font-weight:bold;
    font-size:1.1em;
  }
  </style>
</head>
<body>
  <h1>スマブラSP キャラビンゴ</h1>

<details id="dlc-section">
  <summary>DLCキャラ所持設定</summary>  
  <div id="dlc-area"></div>
</details>

  <label for="size">サイズ：</label>
  <select id="size">
    <option value="3">3x3</option>
    <option value="4">4x4</option>
    <option value="5" selected>5x5</option>
    <option value="6">6x6</option>
  </select>

  <button id="generate-btn">再生成</button>

  <button id="random-cell-btn">ランダム1マス</button>

  <div id="bingo-card" class="bingo-grid"></div>

  <script src="characters.js"></script>
  <script src="script.js"></script>
</body>
</html>
