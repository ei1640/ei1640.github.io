<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スプラ3 ブキルーレット</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2em; }
    h1 { font-size: clamp(18px, 5vw, 32px); }
    #roulette-box { font-size: clamp(24px, 7vw, 48px); margin: 2em 0; height: 2em; }
    button { font-size: clamp(16px, 4vw, 24px); padding: 0.5em 1em; border: none; border-radius: 10px; background-color: #0099cc; color: white; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    fieldset { margin: 1em auto; max-width: 400px; font-size: 1em; }
    label { display: inline-block; margin: 0.3em 1em; }
  </style>
</head>
<body>
  <h1>スプラ3 ブキルーレット</h1>

  <fieldset id="category-group">
    <legend>カテゴリを選択（複数可）</legend>
    <!-- チェックボックスは JS で自動生成 -->
  </fieldset>

  <div id="roulette-box">ブキ名がここに表示されます</div>
  <button id="start-btn">スタート</button>

  <script src="weapons.js"></script>
  <script src="roulette.js"></script>
</body>
</html>
